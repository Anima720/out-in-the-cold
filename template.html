<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>弃于寒冬 · 使命召唤：现代战争 3 非官方同人战役</title>
<style>
:root { --ink:#0b0d0f; --bone:#ebe7dc; --dim:rgba(235,231,220,.66); --faint:rgba(235,231,220,.22); --signal:#ffb347; --alarm:#ff5a40; --line:rgba(235,231,220,.2);
  --f: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif; --sh: 0 0 2px rgba(0,0,0,.8),0 1px 6px rgba(0,0,0,.6); }
html,body { margin:0; height:100%; background:var(--ink); overflow:hidden; color:var(--bone); font-family:var(--f); user-select:none; -webkit-user-select:none; }
#view { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; }
#ui { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
#ui > * { position:absolute; }
#ui:not(.hud-on) .obj, #ui:not(.hud-on) .cross, #ui:not(.hud-on) .ammo, #ui:not(.hud-on) .marker, #ui:not(.hud-on) .prompt { display:none; }
#boot { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:var(--ink); z-index:50; transition:opacity .6s; }
#boot.done { opacity:0; pointer-events:none; }
#boot b { font-size:72px; letter-spacing:.2em; font-weight:900; }
#boot span { font-size:13px; letter-spacing:.2em; color:#8d9aa3; }
.vign { inset:0; opacity:0; background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(120,0,0,.55) 80%, rgba(90,0,0,.9) 100%); }
.blood { inset:0; opacity:0; background:radial-gradient(ellipse at 15% 20%, rgba(110,0,0,.65), transparent 35%), radial-gradient(ellipse at 85% 80%, rgba(110,0,0,.6), transparent 35%), radial-gradient(ellipse at 90% 15%, rgba(100,0,0,.5), transparent 30%); mix-blend-mode:multiply; }
.slowmo { inset:0; opacity:0; transition:opacity .4s; background:radial-gradient(ellipse at center, transparent 40%, rgba(10,20,30,.55) 100%); }
.slowmo.on { opacity:1; }
.obj { left:32px; top:28px; opacity:0; transition:opacity .5s; text-shadow:var(--sh); }
.obj.on { opacity:1; }
.obj-k { font-size:12px; letter-spacing:.3em; color:var(--signal); margin-bottom:6px; }
.obj-t { font-size:20px; font-weight:700; letter-spacing:.08em; padding-left:12px; border-left:3px solid var(--signal); }
.obj.flash .obj-t { animation:objf 1.4s ease; }
@keyframes objf { 0%,30%,60% { color:var(--signal); } 15%,45%,100% { color:var(--bone); } }
.cross { left:50%; top:50%; width:0; height:0; --s:12px; }
.cross i { position:absolute; background:rgba(255,255,255,.85); box-shadow:0 0 2px #000; }
.cross i:nth-child(1) { width:2px; height:9px; left:-1px; top:calc(-1 * var(--s) - 9px); }
.cross i:nth-child(2) { width:2px; height:9px; left:-1px; top:var(--s); }
.cross i:nth-child(3) { height:2px; width:9px; top:-1px; left:calc(-1 * var(--s) - 9px); }
.cross i:nth-child(4) { height:2px; width:9px; top:-1px; left:var(--s); }
.hitm { left:50%; top:50%; width:0; height:0; opacity:0; transition:opacity .08s; }
.hitm i { position:absolute; width:2px; height:10px; background:#fff; box-shadow:0 0 2px #000; }
.hitm i:nth-child(1) { transform:translate(-8px,-14px) rotate(-45deg); } .hitm i:nth-child(2) { transform:translate(7px,-14px) rotate(45deg); }
.hitm i:nth-child(3) { transform:translate(-8px,4px) rotate(45deg); } .hitm i:nth-child(4) { transform:translate(7px,4px) rotate(-45deg); }
.hitm.kill i { background:#ff5a40; height:13px; }
.dmgind { left:50%; top:50%; width:0; height:0; }
.dmgarc { position:absolute; left:-90px; top:-90px; width:180px; height:180px; }
.dmgarc::before { content:''; position:absolute; left:50%; top:-14px; width:70px; height:22px; margin-left:-35px; border-radius:50% 50% 0 0; background:radial-gradient(ellipse at 50% 100%, rgba(255,40,20,.9), rgba(255,40,20,0) 70%); }
.ammo { right:34px; bottom:30px; text-align:right; text-shadow:var(--sh); }
.am-n b { font-size:54px; font-weight:800; letter-spacing:.02em; line-height:1; }
.am-n b.low { color:var(--alarm); }
.am-n span { font-size:18px; color:var(--dim); margin-left:6px; }
.am-w { font-size:13px; letter-spacing:.2em; color:var(--dim); margin-top:4px; }
.am-g { font-size:13px; letter-spacing:.2em; color:var(--dim); margin-top:6px; }
.am-g i.g { display:inline-block; width:9px; height:11px; margin-left:4px; border-radius:45%; background:var(--bone); vertical-align:-1px; }
.am-g i.g.e { background:transparent; border:1px solid var(--faint); }
.nadeind { left:50%; top:50%; opacity:0; transition:opacity .15s; text-align:center; }
.nadeind i { display:block; width:22px; height:26px; margin:0 auto; border-radius:45%; background:rgba(20,20,20,.75); border:2px solid #fff; box-shadow:0 0 6px #000; }
.nadeind span { display:block; color:#fff; font-size:16px; margin-top:-2px; text-shadow:0 0 4px #000; }
.nadeind.close i { border-color:#ff4a30; animation:blink .25s infinite; }
.heat { display:none; width:180px; height:5px; background:rgba(255,255,255,.18); margin:8px 0 0 auto; }
.heat i { display:block; height:100%; background:var(--signal); width:0; }
.heat.hot i { background:var(--alarm); animation:blink .3s infinite; }
@keyframes blink { 50% { opacity:.4; } }
.sub { left:50%; bottom:13vh; transform:translateX(-50%); max-width:min(900px, 86vw); text-align:center; font-size:22px; line-height:1.6; padding:6px 16px; background:rgba(0,0,0,.42); opacity:0; transition:opacity .2s; text-shadow:0 1px 3px #000; }
.sub.on { opacity:1; }
.sub b { font-weight:700; margin-right:4px; }
.prompt { left:50%; top:57%; transform:translateX(-50%); font-size:19px; letter-spacing:.06em; opacity:0; transition:opacity .2s; text-shadow:var(--sh); white-space:nowrap; }
.prompt.on { opacity:1; }
.prompt kbd { display:inline-block; font-family:var(--f); font-size:15px; padding:2px 9px; margin:0 4px; border:1px solid rgba(255,255,255,.7); border-radius:3px; background:rgba(0,0,0,.35); }
.prompt .urgent { color:#fff; font-size:28px; font-weight:800; animation:blink .45s infinite; }
.marker { left:0; top:0; opacity:0; transition:opacity .3s; text-align:center; }
.marker i { display:block; width:12px; height:12px; margin:-6px 0 0 -6px; border:2px solid var(--signal); transform:rotate(45deg); box-shadow:0 0 4px #000; }
.marker span { display:block; transform:translateX(-50%); margin-top:6px; font-size:13px; color:var(--signal); text-shadow:var(--sh); white-space:nowrap; }
.loc { left:5.5vw; bottom:26vh; padding-left:16px; opacity:0; transition:opacity .8s; text-shadow:var(--sh); }
.loc.on { opacity:1; }
.loc i { position:absolute; left:0; top:4px; bottom:4px; width:3px; background:var(--signal); }
.loc b { display:block; font-size:44px; font-weight:900; letter-spacing:.3em; }
.loc span { display:block; font-size:15px; letter-spacing:.12em; color:var(--dim); margin-top:6px; }
.loc.on b { animation:typein 1.1s steps(12,end) both; }
@keyframes typein { from { clip-path:inset(0 100% 0 0); } to { clip-path:inset(0 -2% 0 0); } }
.fade { inset:0; opacity:0; background:#000; }
.menu { inset:0; display:none; pointer-events:auto; align-items:center; justify-content:center; background:rgba(8,10,12,.55); }
.menu.on { display:flex; }
.menu.title { background:linear-gradient(90deg, rgba(8,10,12,.88) 0%, rgba(8,10,12,.55) 55%, rgba(8,10,12,.1) 100%); justify-content:flex-start; }
.m-title { max-width:660px; padding:0 6vw; }
.m-eyebrow { font-size:12px; letter-spacing:.32em; color:var(--signal); }
.m-word { font-size:clamp(64px, 11vw, 140px); font-weight:900; letter-spacing:.12em; line-height:1.1; margin:14px 0 18px; }
.m-subtitle { display:block; font-size:16px; font-weight:600; letter-spacing:.32em; color:var(--dim); margin-top:6px; }
.m-premise { font-size:15px; line-height:1.9; color:var(--dim); margin:0 0 22px; }
.m-actions { display:flex; gap:12px; flex-wrap:wrap; margin:18px 0; }
.m-actions.col { flex-direction:column; }
.btn { font-family:var(--f); font-size:15px; letter-spacing:.16em; min-height:46px; padding:0 26px; border:1px solid rgba(235,231,220,.45); background:transparent; color:var(--bone); cursor:pointer; }
.btn:hover { border-color:var(--bone); background:rgba(255,255,255,.06); }
.btn.primary { background:var(--signal); border-color:var(--signal); color:#141414; font-weight:800; }
.btn.primary:hover { background:#ffc777; }
.m-set { display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:13px; letter-spacing:.14em; color:var(--dim); margin:14px 0; }
.seg { display:flex; }
.seg button { font-family:var(--f); min-width:46px; height:32px; background:transparent; color:var(--dim); border:1px solid rgba(235,231,220,.35); margin-left:-1px; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--bone); color:#111; border-color:var(--bone); }
.m-set input { width:140px; accent-color:var(--signal); }
.m-set output { min-width:3ch; color:var(--bone); }
.m-legend { font-size:12.5px; line-height:1.9; color:var(--dim); letter-spacing:.06em; margin-top:10px; }
.m-note { font-size:12.5px; line-height:1.8; color:rgba(235,231,220,.5); margin-top:12px; }
.m-card { background:rgba(10,12,14,.9); border:1px solid var(--line); padding:30px 34px; min-width:min(420px, 86vw); max-width:86vw; }
.m-card.wide { min-width:min(560px, 90vw); }
.m-h { font-size:34px; font-weight:800; letter-spacing:.08em; margin:10px 0 6px; }
.m-stats { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin:22px 0 8px; }
.m-stats div { border-top:1px solid var(--line); padding-top:10px; }
.m-stats span { display:block; font-size:12px; letter-spacing:.2em; color:var(--dim); }
.m-stats b { display:block; font-size:30px; font-weight:800; margin-top:4px; }

.upl { left:50%; top:26px; transform:translateX(-50%); width:300px; opacity:0; transition:opacity .4s; text-shadow:var(--sh); font-size:13px; letter-spacing:.12em; }
.upl.on { opacity:1; }
.upl .row { display:flex; justify-content:space-between; margin-bottom:5px; }
.upl .bar { height:6px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); }
.upl .bar i { display:block; height:100%; width:0; background:var(--signal); transition:width .3s linear; }
.upl.stall .bar i { background:#ff5a46; }
.upl.stall b { color:#ff5a46; animation:blink .6s infinite; }
.hold { left:50%; top:calc(57% + 34px); transform:translateX(-50%); width:180px; height:4px; background:rgba(255,255,255,.2); opacity:0; }
.hold.on { opacity:1; }
.hold i { display:block; height:100%; width:0; background:#fff; }
.lockbox { left:0; top:0; width:64px; height:64px; margin:-32px 0 0 -32px; border:2px solid rgba(255,220,120,.85); opacity:0; transition:border-color .1s; }
.lockbox.on { opacity:1; }
.lockbox.locked { border-color:#ff4a3a; box-shadow:0 0 10px rgba(255,60,40,.6); }
.lockbox span { position:absolute; left:50%; top:100%; transform:translateX(-50%); margin-top:4px; font-size:12px; letter-spacing:.12em; white-space:nowrap; color:inherit; text-shadow:var(--sh); }
.bigcard { left:0; right:0; top:42%; text-align:center; opacity:0; transition:opacity 1.6s; text-shadow:var(--sh); pointer-events:none; }
.bigcard.on { opacity:1; }
.bigcard b { display:block; font-size:44px; letter-spacing:.35em; font-weight:300; }
.bigcard span { display:block; margin-top:14px; font-size:15px; letter-spacing:.3em; opacity:.8; }
#ui:not(.hud-on) .upl, #ui:not(.hud-on) .lockbox, #ui:not(.hud-on) .hold { display:none; }

/* ---- v5 UI pass ---- */
.scope { inset:0; display:none; background:radial-gradient(circle at 50% 50%, transparent 0, transparent 37vh, #000 37.3vh); }
.scope.on { display:block; }
.scope-ret { position:absolute; inset:0; transform-origin:50% 50%; }
.scope i { position:absolute; background:#000; }
.scope i:nth-child(1) { left:50%; top:13vh; bottom:13vh; width:2px; margin-left:-1px; }
.scope i:nth-child(2) { top:50%; left:calc(50% - 37vh); right:calc(50% - 37vh); height:2px; margin-top:-1px; }
.scope b { position:absolute; left:50%; top:50%; width:0; height:0; border:7px solid transparent; border-bottom:12px solid #000; transform:translate(-50%, -2px); }
.ftag { left:0; top:0; font-size:13px; letter-spacing:.14em; color:#8fd18a; text-shadow:var(--sh); opacity:0; transition:opacity .15s; white-space:nowrap; }
#ui:not(.hud-on) .ftag { display:none; }
.obj { top:22px; left:26px; max-width:34vw; padding:10px 18px 12px 14px; background:linear-gradient(90deg, rgba(6,8,10,.55), rgba(6,8,10,0)); }
.obj-k { font-size:11px; letter-spacing:.4em; }
.obj-t { font-size:19px; }
.compass { left:50%; top:14px; width:min(560px, 60vw); height:30px; transform:translateX(-50%); overflow:hidden; -webkit-mask-image:linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask-image:linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
.compass .strip { position:absolute; left:0; top:0; height:30px; white-space:nowrap; will-change:transform; }
.compass .strip span { position:absolute; top:0; width:40px; margin-left:-20px; text-align:center; font-size:11px; letter-spacing:.08em; color:var(--dim); text-shadow:var(--sh); }
.compass .strip span.c { color:var(--bone); font-size:14px; font-weight:800; }
.compass .strip span::after { content:''; position:absolute; left:50%; top:17px; width:1px; height:6px; background:var(--faint); }
.compass .strip span.c::after { height:9px; background:var(--bone); }
.compass .ctr { position:absolute; left:50%; top:22px; width:0; height:0; border:5px solid transparent; border-bottom-color:var(--signal); transform:translate(-50%, 0); }
.compass .tgt { position:absolute; top:14px; width:10px; height:10px; margin-left:-5px; border:2px solid var(--signal); transform:rotate(45deg); display:none; }
#ui:not(.hud-on) .compass { display:none; }
.upl { top:54px; }
.ammo { right:28px; bottom:24px; padding:12px 16px 12px 30px; background:linear-gradient(270deg, rgba(6,8,10,.62), rgba(6,8,10,0)); }
.am-bar { display:flex; justify-content:flex-end; gap:2px; margin-top:6px; height:9px; }
.am-bar i { width:3px; height:9px; background:var(--bone); opacity:.9; }
.am-bar i.e { opacity:.18; }
.am-g .clay { margin-left:12px; color:var(--signal); }
.toast { right:30px; bottom:150px; font-size:14px; letter-spacing:.14em; color:var(--signal); text-shadow:var(--sh); opacity:0; transform:translateY(6px); transition:opacity .25s, transform .25s; }
.toast.on { opacity:1; transform:none; }
.sub { --c:#ebe7dc; text-align:left; padding:10px 18px 11px 16px; background:linear-gradient(90deg, rgba(10,13,16,.82), rgba(10,13,16,.66)); border:1px solid rgba(235,231,220,.14); border-left:3px solid var(--c); border-radius:3px; box-shadow:0 6px 24px rgba(0,0,0,.35); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); text-shadow:0 1px 2px rgba(0,0,0,.7); font-size:21px; transform:translateX(-50%) translateY(6px); transition:opacity .22s, transform .22s; }
.sub.on { transform:translateX(-50%); }
.sub .sp { display:flex; align-items:center; gap:8px; margin-bottom:3px; font-size:.68em; font-weight:700; letter-spacing:.18em; color:var(--c); }
.sub .sp em { font-style:normal; font-weight:500; letter-spacing:.12em; padding:1px 6px 1px 18px; border:1px solid rgba(235,231,220,.25); border-radius:2px; color:var(--dim); position:relative; }
.sub .sp em::before { content:''; position:absolute; left:6px; top:50%; width:6px; height:6px; margin-top:-3px; border-radius:50%; background:var(--c); box-shadow:0 0 6px var(--c); animation:radio 1.1s infinite; }
@keyframes radio { 50% { opacity:.25; } }
.sub .tx { display:block; line-height:1.55; color:#f3efe6; }
.menu.title { align-items:stretch; }
.m-title { display:flex; flex-direction:column; justify-content:center; max-width:760px; }
.chapters { display:grid; grid-template-columns:repeat(2, minmax(200px, 1fr)); gap:10px; margin:6px 0 14px; }
.chap { text-align:left; font-family:var(--f); color:var(--bone); background:rgba(10,12,14,.55); border:1px solid var(--line); padding:12px 14px 13px; cursor:pointer; transition:border-color .15s, background .15s, transform .15s; }
.chap:hover { border-color:var(--signal); background:rgba(255,179,71,.08); transform:translateX(3px); }
.chap small { display:block; font-size:11px; letter-spacing:.3em; color:var(--signal); }
.chap b { display:block; font-size:20px; letter-spacing:.14em; margin:4px 0 3px; }
.chap span { display:block; font-size:12px; color:var(--dim); letter-spacing:.04em; line-height:1.5; }
.m-card { box-shadow:0 30px 80px rgba(0,0,0,.5); border-top:2px solid var(--signal); }
.credits { inset:0; overflow:hidden; background:#000; display:none; pointer-events:none; }
.credits.on { display:block; }
.credits .roll { position:absolute; left:0; right:0; top:100%; text-align:center; will-change:transform; }
.credits h2 { font-size:30px; letter-spacing:.4em; font-weight:300; margin:0 0 70px; }
.credits h3 { font-size:12px; letter-spacing:.4em; color:var(--signal); font-weight:600; margin:46px 0 10px; }
.credits p { font-size:17px; letter-spacing:.12em; margin:6px 0; color:var(--bone); }
.credits p em { font-style:normal; color:var(--dim); font-size:13px; margin-left:10px; }
.credits .fin { margin-top:120px; font-size:13px; letter-spacing:.3em; color:var(--dim); }
.letterbox::before, .letterbox::after { content:''; position:fixed; left:0; right:0; height:11vh; background:#000; z-index:3; }
.letterbox::before { top:0; } .letterbox::after { bottom:0; }
#ui.letterbox .obj, #ui.letterbox .ammo, #ui.letterbox .compass, #ui.letterbox .cross, #ui.letterbox .upl { display:none; }

/* ---- responsive HUD: clear centre, reserved subtitle band, compact edge information ---- */
#ui { --mm:clamp(68px, 23vh, 168px); --edge:clamp(8px, 1.6vh, 18px); --sub-safe:clamp(50px, 9vh, 96px); }
.minimap { left:var(--edge); top:var(--edge); width:var(--mm); height:var(--mm); background:rgba(8,11,14,.48); border:1px solid rgba(235,231,220,.3); border-radius:2px; box-shadow:0 0 0 1px rgba(0,0,0,.3); overflow:hidden; }
.minimap canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.minimap .mm-fx { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.28) 100%); }
.obj { left:var(--edge); top:calc(var(--edge) + var(--mm) + 6px); max-width:min(29vw, 330px); padding:5px 8px 6px 6px; box-sizing:border-box; }
.obj-k { font-size:clamp(9px, 1.3vh, 12px); letter-spacing:.16em; margin-bottom:4px; }
.obj-t { font-size:clamp(12px, 1.7vh, 18px); line-height:1.4; letter-spacing:.02em; padding-left:6px; border-left-width:2px; }
.compass { top:var(--edge); width:min(560px, calc(100vw - 2 * (var(--mm) + 2 * var(--edge) + 12px))); height:28px; }
.upl { top:calc(var(--edge) + 31px); width:min(300px, calc(100vw - 2 * (var(--mm) + 2 * var(--edge) + 12px))); font-size:clamp(11px, 1.6vh, 14px); letter-spacing:.03em; }
.upl .row { gap:10px; align-items:center; }
.upl .row span, .upl .row b { flex-shrink:0; white-space:nowrap; }
.upl .bar { height:4px; }
.ammo { right:var(--edge); bottom:var(--sub-safe); padding:5px 7px 6px 14px; max-width:30vw; }
.am-n b { font-size:clamp(25px, 5.1vh, 50px); }
.am-n span { font-size:clamp(12px, 1.8vh, 18px); margin-left:4px; }
.am-w, .am-g { font-size:clamp(10px, 1.5vh, 13px); letter-spacing:.06em; margin-top:3px; }
.am-g { white-space:nowrap; }
.am-g i.g { width:6px; height:8px; margin-left:3px; }
.am-g .clay { margin-left:7px; }
.am-bar { gap:1px; height:4px; margin-top:4px; }
.am-bar i { width:2px; height:4px; }
.heat { width:clamp(90px, 18vw, 180px); margin-top:5px; }
.sub { left:50%; bottom:var(--edge); width:min(860px, calc(100vw - 2 * var(--edge))); max-width:none; box-sizing:border-box; padding:6px 12px; font-size:clamp(12px, 1.9vh, 20px); line-height:1.4; text-align:center; border-radius:2px; border-left-width:2px; background:rgba(7,10,13,.74); box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; z-index:5; }
.sub .sp { display:inline-flex; font-size:.9em; letter-spacing:.06em; gap:5px; margin:0 8px 0 0; vertical-align:baseline; }
.sub .sp em { font-size:.85em; letter-spacing:0; padding:0 3px 0 11px; border:0; }
.sub .sp em::before { left:1px; width:4px; height:4px; margin-top:-2px; box-shadow:none; }
